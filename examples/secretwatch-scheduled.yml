# Copy this file into your repo at .github/workflows/secretwatch.yml
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   SLACK_WEBHOOK_URL       Your Slack incoming webhook URL
#
# Add whichever stores you use:
#   AWS_ACCESS_KEY_ID       } AWS credentials with read access to Secrets Manager
#   AWS_SECRET_ACCESS_KEY   } and IAM (ListUsers, ListAccessKeys)
#
#   VAULT_TOKEN             Vault token with read access to your configured paths
#   VAULT_ADDR              Vault address (e.g. https://vault.example.com)
#
#   GOOGLE_CREDENTIALS      GCP service account key JSON (base64-encoded)
#                           with roles: Secret Manager Viewer, IAM Service Account Key Viewer
#
#   GITHUB_TOKEN is provided automatically — no secret needed for GitHub secrets scanning.
#
# Tip: use AWS OIDC instead of static keys if your org supports it (see README).

name: SecretWatch — daily rotation check

on:
  schedule:
    - cron: '0 8 * * 1-5'   # 8am UTC, Mon–Fri
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  secretwatch:
    runs-on: ubuntu-latest

    steps:
      - name: Create config
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VAULT_TOKEN:       ${{ secrets.VAULT_TOKEN }}
          VAULT_ADDR:        ${{ secrets.VAULT_ADDR }}
          HAS_AWS:           ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_GCP:           ${{ secrets.GOOGLE_CREDENTIALS != '' }}
          HAS_VAULT:         ${{ secrets.VAULT_TOKEN != '' }}
        run: |
          mkdir -p ~/.secretwatch

          # Build the config conditionally based on which credentials are available.
          # Stores with no credentials are simply omitted; failed stores warn and continue.
          {
            echo "stores:"

            if [[ "$HAS_AWS" == "true" ]]; then
              cat << 'YAML'
              aws:
                - regions:
                    - us-east-1
                    - us-west-2
                  # profile: optional-profile
              aws_iam:
                - {}
          YAML
            fi

            if [[ "$HAS_GCP" == "true" ]]; then
              cat << 'YAML'
              gcp:
                - project: YOUR_GCP_PROJECT     # <-- replace
              gcp_sa_keys:
                - project: YOUR_GCP_PROJECT     # <-- replace
          YAML
            fi

            if [[ "$HAS_VAULT" == "true" ]]; then
              cat << YAML
              vault:
                enabled: true
                address: ${VAULT_ADDR:-http://127.0.0.1:8200}
                token: $VAULT_TOKEN
                paths:
                  - secret/
          YAML
            fi

            cat << 'YAML'
              github:
                enabled: true
                org: YOUR_GITHUB_ORG              # <-- replace

          rotation_policy:
            default_max_age_days: 90
            overrides:
              - pattern: "prod-*"
                max_age_days: 30

          alerts:
            notify_on:
              - overdue
              - warning
          YAML

            if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
              echo "  slack_webhook_url: $SLACK_WEBHOOK_URL"
            fi

          } > ~/.secretwatch/config.yaml

      - name: Set up GCP credentials
        if: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" | base64 -d > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Install secretwatch
        run: |
          curl -sSL https://github.com/leylmordor/secretwatch/releases/latest/download/secretwatch_linux_amd64.tar.gz \
            | tar xz secretwatch
          sudo mv secretwatch /usr/local/bin/

      - name: Scan
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VAULT_TOKEN:           ${{ secrets.VAULT_TOKEN }}
          VAULT_ADDR:            ${{ secrets.VAULT_ADDR }}
        run: secretwatch scan

      - name: Alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: secretwatch alert

      - name: Show summary
        run: secretwatch list
